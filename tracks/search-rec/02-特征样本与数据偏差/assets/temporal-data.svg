<text x="265.0" y="197.0" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="20" fill="#243b59">历史训练窗口</text>
<rect x="570" y="133" width="410" height="112" rx="14" fill="#ede9fb" stroke="#c4d2e5"/>
<text x="594" y="162" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#6c7890">2</text>
<text x="775.0" y="197.0" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="20" fill="#243b59">标签成熟等待</text>
<rect x="570" y="288" width="410" height="112" rx="14" fill="#e6f5ed" stroke="#c4d2e5"/>
<text x="594" y="317" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#6c7890">3</text>
<text x="775.0" y="352.0" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="20" fill="#243b59">未来验证窗口</text>
