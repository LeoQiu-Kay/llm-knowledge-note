<rect width="1040" height="460" rx="20" fill="#fff"/>
<path d="M40 91H1000" stroke="#e0e7f0"/>
<text x="40" y="56" text-anchor="start" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="27" fill="#243b59">时间切分与延迟反馈</text>
<rect x="60" y="133" width="410" height="112" rx="14" fill="#eef4ff" stroke="#c4d2e5"/>
