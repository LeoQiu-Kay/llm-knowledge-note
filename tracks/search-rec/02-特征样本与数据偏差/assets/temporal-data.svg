<path d="M775 250L775 279" fill="none" stroke="#8495af" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M555 344L480 344" fill="none" stroke="#8495af" stroke-width="2" marker-end="url(#arrow)"/>
