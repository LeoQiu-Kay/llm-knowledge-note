<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="460" viewBox="0 0 1040 460" role="img"><title>MMR 示例：更相关还是更不重复？</title><rect width="1040" height="460" rx="20" fill="white"/><style>text{font-family:PingFang SC,Microsoft YaHei,sans-serif;fill:#243b59;font-size:20px}.small{font-size:17px;fill:#65758b}</style><text x="40" y="55" style="font-size:27px">MMR 示例：更相关还是更不重复？</text><path d="M40 88H1000" stroke="#e0e7f0"/><text x="65" y="140">候选</text><text x="285" y="140">相关性 s</text><text x="510" y="140">最大相似度</text><text x="790" y="140">MMR，λ=0.7</text><rect x="45" y="170" width="950" height="65" rx="10" fill="#eef4ff"/><text x="70" y="212">A</text><text x="315" y="212">0.90</text><text x="565" y="212">0.95</text><text x="820" y="212">0.345</text><rect x="45" y="260" width="950" height="65" rx="10" fill="#dcf1e8"/><text x="70" y="302">B</text><text x="315" y="302">0.80</text><text x="565" y="302">0.20</text><text x="820" y="302">0.500</text><text class="small" x="65" y="395">本轮选择 B：在相关性略低的情况下，减少与已选结果的重复。</text></svg>