<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="460" viewBox="0 0 1040 460" role="img"><title>CUPED：协变量必须来自实验之前</title><rect width="1040" height="460" rx="20" fill="white"/><style>text{font-family:PingFang SC,Microsoft YaHei,sans-serif;fill:#243b59;font-size:20px}.small{font-size:17px;fill:#65758b}</style><text x="40" y="55" style="font-size:27px">CUPED：协变量必须来自实验之前</text><path d="M40 88H1000" stroke="#e0e7f0"/><path d="M70 225H970" stroke="#8495af" stroke-width="3"/><rect x="80" y="140" width="355" height="75" rx="10" fill="#eef4ff"/><text x="125" y="185">实验前：收集协变量 X</text><path d="M475 115V355" stroke="#8063ac" stroke-width="2" stroke-dasharray="7 7"/><text x="423" y="395">开始分流</text><rect x="520" y="140" width="440" height="75" rx="10" fill="#dcf1e8"/><text x="560" y="185">实验期间：观察结果 Y</text><text class="small" x="85" y="295">X 不应被实验策略改变</text><text class="small" x="545" y="295">调整 Y，降低可解释的个体差异</text><text class="small" x="545" y="337">分流与统计单位保持一致</text></svg>