<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="460" viewBox="0 0 1040 460" role="img"><title>概率的条件空间：每 1,000 次曝光</title><rect width="1040" height="460" rx="20" fill="white"/><style>text{font-family:PingFang SC,Microsoft YaHei,sans-serif;fill:#243b59;font-size:20px}.small{font-size:17px;fill:#65758b}</style><text x="40" y="55" style="font-size:27px">概率的条件空间：每 1,000 次曝光</text><path d="M40 88H1000" stroke="#e0e7f0"/><rect x="60" y="140" width="265" height="130" rx="14" fill="#eef4ff"/><text x="100" y="190">1,000 次曝光</text><text class="small" x="100" y="230">CTR = 0.1</text><path d="M335 205H385" stroke="#8495af" stroke-width="3"/><rect x="400" y="140" width="250" height="130" rx="14" fill="#ede7fa"/><text x="445" y="190">100 次点击</text><text class="small" x="445" y="230">CVR = 0.05</text><path d="M660 205H710" stroke="#8495af" stroke-width="3"/><rect x="725" y="140" width="250" height="130" rx="14" fill="#dcf1e8"/><text x="775" y="190">5 次转化</text><text class="small" x="775" y="230">点击归因</text><text x="200" y="350">CTCVR = 5 / 1,000 = 0.1 × 0.05 = 0.005</text><text class="small" x="200" y="395">图中次数为便于理解的期望值示例，不是业务实测数据。</text></svg>