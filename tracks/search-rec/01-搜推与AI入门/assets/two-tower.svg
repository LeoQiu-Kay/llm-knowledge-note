<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc">
<title id="title">双塔为什么适合大规模召回？</title><desc id="desc">独立编码让物品侧可预计算；联合交互能力相对受限</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10" fill="#8093ab"/></marker></defs>
<rect width="960" height="480" rx="14" fill="#ffffff"/>
<path d="M38 100 H922" stroke="#e5ebf3" stroke-width="1"/><rect x="38" y="99" width="52" height="3" rx="1.5" fill="#517cbc"/><g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif"><text x="38" y="48" fill="#172d4b" font-size="26" font-weight="700">双塔为什么适合大规模召回？</text><text x="38" y="80" fill="#465a73" font-size="16">独立编码让物品侧可预计算；联合交互能力相对受限</text><text x="38" y="122" fill="#6343a6" font-size="18">离线构建</text><rect x="40" y="145" width="235" height="80" rx="10" fill="#eff5ff" stroke="#a8c3eb" stroke-width="1"/><text x="157.5" y="175" fill="#172d4b" font-size="19" text-anchor="middle" font-weight="600">物品内容 / 特征</text><text x="157.5" y="202" fill="#465a73" font-size="15" text-anchor="middle">标题、属性、图像或 ID</text><rect x="360" y="145" width="235" height="80" rx="10" fill="#eff5ff" stroke="#a8c3eb" stroke-width="1"/><text x="477.5" y="175" fill="#172d4b" font-size="19" text-anchor="middle" font-weight="600">物品编码器</text><text x="477.5" y="202" fill="#465a73" font-size="15" text-anchor="middle">输出物品向量 v</text><rect x="680" y="145" width="235" height="80" rx="10" fill="#eff5ff" stroke="#a8c3eb" stroke-width="1"/><text x="797.5" y="175" fill="#172d4b" font-size="19" text-anchor="middle" font-weight="600">版本化向量索引</text><text x="797.5" y="202" fill="#465a73" font-size="15" text-anchor="middle">ANN 检索结构</text><path d="M280 185 L352 185" stroke="#8093ab" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M598 185 L672 185" stroke="#8093ab" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="38" y="279" fill="#6343a6" font-size="18">在线请求</text><rect x="40" y="300" width="235" height="80" rx="10" fill="#eff5ff" stroke="#a8c3eb" stroke-width="1"/><text x="157.5" y="330" fill="#172d4b" font-size="19" text-anchor="middle" font-weight="600">Query / 用户上下文</text><text x="157.5" y="357" fill="#465a73" font-size="15" text-anchor="middle">当前请求 x</text><rect x="360" y="300" width="235" height="80" rx="10" fill="#eff5ff" stroke="#a8c3eb" stroke-width="1"/><text x="477.5" y="330" fill="#172d4b" font-size="19" text-anchor="middle" font-weight="600">请求编码器</text><text x="477.5" y="357" fill="#465a73" font-size="15" text-anchor="middle">输出请求向量 u</text><rect x="680" y="300" width="235" height="80" rx="10" fill="#eff5ff" stroke="#a8c3eb" stroke-width="1"/><text x="797.5" y="330" fill="#172d4b" font-size="19" text-anchor="middle" font-weight="600">ANN 查找 Top-K</text><text x="797.5" y="357" fill="#465a73" font-size="15" text-anchor="middle">与物品向量比较</text><path d="M280 340 L352 340" stroke="#8093ab" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M598 340 L672 340" stroke="#8093ab" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M796 228 L796 292" stroke="#8093ab" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="40" y="422" fill="#465a73" font-size="16">训练时两侧联合学习；上线时请求编码器与物品索引必须版本兼容。</text><text x="38" y="460" fill="#687a90" font-size="13">OfferPilot · 搜索推荐算法</text></g></svg>