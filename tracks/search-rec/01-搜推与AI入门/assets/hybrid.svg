<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc">
<title id="title">混合搜索：精确词项与语义互补</title><desc id="desc">召回、过滤、精排分工清楚，生成式判断不能覆盖事实约束</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10" fill="#8093ab"/></marker></defs>
<rect width="960" height="480" rx="14" fill="#ffffff"/>
<path d="M38 100 H922" stroke="#e5ebf3" stroke-width="1"/><rect x="38" y="99" width="52" height="3" rx="1.5" fill="#517cbc"/><g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif"><text x="38" y="48" fill="#172d4b" font-size="26" font-weight="700">混合搜索：精确词项与语义互补</text><text x="38" y="80" fill="#465a73" font-size="16">召回、过滤、精排分工清楚，生成式判断不能覆盖事实约束</text><rect x="35" y="195" width="165" height="80" rx="10" fill="#eff5ff" stroke="#a8c3eb" stroke-width="1"/><text x="117.5" y="225" fill="#172d4b" font-size="19" text-anchor="middle" font-weight="600">原始 Query</text><text x="117.5" y="252" fill="#465a73" font-size="15" text-anchor="middle">保留硬约束</text><rect x="270" y="125" width="195" height="80" rx="10" fill="#eff5ff" stroke="#a8c3eb" stroke-width="1"/><text x="367.5" y="155" fill="#172d4b" font-size="19" text-anchor="middle" font-weight="600">词项召回</text><text x="367.5" y="182" fill="#465a73" font-size="15" text-anchor="middle">型号 / 专名 / 关键词</text><rect x="270" y="275" width="195" height="80" rx="10" fill="#eff5ff" stroke="#a8c3eb" stroke-width="1"/><text x="367.5" y="305" fill="#172d4b" font-size="19" text-anchor="middle" font-weight="600">向量召回</text><text x="367.5" y="332" fill="#465a73" font-size="15" text-anchor="middle">语义表达 / 同义匹配</text><rect x="535" y="195" width="160" height="80" rx="10" fill="#eff5ff" stroke="#a8c3eb" stroke-width="1"/><text x="615.0" y="225" fill="#172d4b" font-size="19" text-anchor="middle" font-weight="600">融合与过滤</text><text x="615.0" y="252" fill="#465a73" font-size="15" text-anchor="middle">RRF / 事实约束</text><rect x="755" y="195" width="170" height="80" rx="10" fill="#eff5ff" stroke="#a8c3eb" stroke-width="1"/><text x="840.0" y="225" fill="#172d4b" font-size="19" text-anchor="middle" font-weight="600">精细重排</text><text x="840.0" y="252" fill="#465a73" font-size="15" text-anchor="middle">小候选集</text><path d="M203 230 L260 165" stroke="#8093ab" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M203 245 L260 315" stroke="#8093ab" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M468 165 L528 230" stroke="#8093ab" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M468 315 L528 245" stroke="#8093ab" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M698 235 L748 235" stroke="#8093ab" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="40" y="390" fill="#465a73" font-size="16">可选：受约束 Query 改写作为补充召回，不替换原查询。</text><text x="40" y="421" fill="#6343a6" font-size="16">重排超时或输出非法 → 回退至合法的融合结果。</text><text x="38" y="460" fill="#687a90" font-size="13">OfferPilot · 搜索推荐算法</text></g></svg>