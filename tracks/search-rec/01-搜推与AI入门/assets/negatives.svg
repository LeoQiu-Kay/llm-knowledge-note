"385" height="82" rx="10" fill="#edf8f3" stroke="#94ccbb" stroke-width="1"/><text x="697.5" y="195" fill="#172d4b" font-size="19" text-anchor="middle" font-weight="600">对角线：已知配对</text><text x="697.5" y="222" fill="#465a73" font-size="15" text-anchor="middle">请求 i 与物品 i 为训练正例</text><rect x="505" y="278" width="385" height="82" rx="10" fill="#f4effb" stroke="#c9b6e6" stroke-width="1"/><text x="697.5" y="308" fill="#172d4b" font-size="19" text-anchor="middle" font-weight="600">非对角线：需要判断</text><text x="697.5" y="335" fill="#465a73" font-size="15" text-anchor="middle">重复物品 / 多个相关答案可能是假负例</text><text x="50" y="422" fill="#465a73" font-size="16">拉开真实负例，而不是强迫所有未标注候选彼此排斥。</text><text x="38" y="460" fill="#687a90" font-size="13">OfferPilot · 搜索推荐算法</text></g></svg>