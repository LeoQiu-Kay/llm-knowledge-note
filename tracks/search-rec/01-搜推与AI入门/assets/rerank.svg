<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc">
<title id="title">三种匹配方式，三种计算边界</title><desc id="desc">理解输入形式与成本，比背诵模型名字更重要</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10" fill="#8093ab"/></marker></defs>
<rect width="960" height="480" rx="14" fill="#ffffff"/>
<path d="M38 100 H922" stroke="#e5ebf3" stroke-width="1"/><rect x="38" y="99" width="52" height="3" rx="1.5" fill="#517cbc"/><g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif"><text x="38" y="48" fill="#172d4b" font-size="26" font-weight="700">三种匹配方式，三种计算边界</text><text x="38" y="80" fill="#465a73" font-size="16">理解输入形式与成本，比背诵模型名字更重要</text><rect x="35" y="125" width="275" height="80" rx="10" fill="#eff5ff" stroke="#a8c3eb" stroke-width="1"/><text x="172.5" y="155" fill="#172d4b" font-size="19" text-anchor="middle" font-weight="600">双编码器</text><text x="172.5" y="182" fill="#465a73" font-size="15" text-anchor="middle">分别编码，再算相似度</text><text x="55" y="245" fill="#354d67" font-size="16">Query → 向量 u</text><text x="55" y="282" fill="#354d67" font-size="16">文档 → 向量 v</text><text x="55" y="319" fill="#354d67" font-size="16">u · v → 分数</text><text x="55" y="356" fill="#6343a6" font-size="16">文档向量可预计算</text><rect x="344" y="125" width="275" height="80" rx="10" fill="#eff5ff" stroke="#a8c3eb" stroke-width="1"/><text x="481.5" y="155" fill="#172d4b" font-size="19" text-anchor="middle" font-weight="600">Cross-Encoder</text><text x="481.5" y="182" fill="#465a73" font-size="15" text-anchor="middle">联合读取一对文本</text><text x="364" y="245" fill="#354d67" font-size="16">[Query, 文档]</text><text x="364" y="282" fill="#354d67" font-size="16">联合交互 → 分数</text><text x="364" y="319" fill="#354d67" font-size="16">对每个候选计算</text><text x="364" y="356" fill="#6343a6" font-size="16">常用于候选精排</text><rect x="653" y="125" width="275" height="80" rx="10" fill="#eff5ff" stroke="#a8c3eb" stroke-width="1"/><text x="790.5" y="155" fill="#172d4b" font-size="19" text-anchor="middle" font-weight="600">列表式 LLM</text><text x="790.5" y="182" fill="#465a73" font-size="15" text-anchor="middle">联合比较多个候选</text><text x="673" y="245" fill="#354d67" font-size="16">[Query, A, B, C]</text><text x="673" y="282" fill="#354d67" font-size="16">输出 [B, A, C]</text><text x="673" y="319" fill="#354d67" font-size="16">验证 ID 与唯一性</text><text x="673" y="356" fill="#6343a6" font-size="16">失败时有确定性回退</text><text x="38" y="460" fill="#687a90" font-size="13">OfferPilot · 搜索推荐算法</text></g></svg>