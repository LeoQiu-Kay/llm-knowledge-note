<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc">
<title id="title">从海量候选到有限展示位</title><desc id="desc">多阶段架构的核心：把计算用在更有希望的候选上</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10" fill="#8093ab"/></marker></defs>
<rect width="960" height="480" rx="14" fill="#ffffff"/>
<path d="M38 100 H922" stroke="#e5ebf3" stroke-width="1"/><rect x="38" y="99" width="52" height="3" rx="1.5" fill="#517cbc"/><g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif"><text x="38" y="48" fill="#172d4b" font-size="26" font-weight="700">从海量候选到有限展示位</text><text x="38" y="80" fill="#465a73" font-size="16">多阶段架构的核心：把计算用在更有希望的候选上</text><rect x="35" y="145" width="155" height="83" rx="10" fill="#eff5ff" stroke="#a8c3eb" stroke-width="1"/><text x="112.5" y="175" fill="#172d4b" font-size="19" text-anchor="middle" font-weight="600">候选库</text><text x="112.5" y="202" fill="#465a73" font-size="15" text-anchor="middle">示例：100 万条</text><path d="M192 185 L214 185" stroke="#8093ab" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="219" y="145" width="155" height="83" rx="10" fill="#eff5ff" stroke="#a8c3eb" stroke-width="1"/><text x="296.5" y="175" fill="#172d4b" font-size="19" text-anchor="middle" font-weight="600">多路召回</text><text x="296.5" y="202" fill="#465a73" font-size="15" text-anchor="middle">示例：2,000 条</text><path d="M376 185 L398 185" stroke="#8093ab" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="403" y="145" width="155" height="83" rx="10" fill="#eff5ff" stroke="#a8c3eb" stroke-width="1"/><text x="480.5" y="175" fill="#172d4b" font-size="19" text-anchor="middle" font-weight="600">合并与过滤</text><text x="480.5" y="202" fill="#465a73" font-size="15" text-anchor="middle">去重 / 必要约束</text><path d="M560 185 L582 185" stroke="#8093ab" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="587" y="145" width="155" height="83" rx="10" fill="#eff5ff" stroke="#a8c3eb" stroke-width="1"/><text x="664.5" y="175" fill="#172d4b" font-size="19" text-anchor="middle" font-weight="600">候选排序</text><text x="664.5" y="202" fill="#465a73" font-size="15" text-anchor="middle">示例：100 条</text><path d="M744 185 L766 185" stroke="#8093ab" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="771" y="145" width="155" height="83" rx="10" fill="#eff5ff" stroke="#a8c3eb" stroke-width="1"/><text x="848.5" y="175" fill="#172d4b" font-size="19" text-anchor="middle" font-weight="600">列表重排</text><text x="848.5" y="202" fill="#465a73" font-size="15" text-anchor="middle">示例：展示 10 条</text><text x="40" y="290" fill="#6343a6" font-size="19">越往右：候选更少，单候选可分配的计算更多。</text><text x="40" y="328" fill="#465a73" font-size="16">搜索：Query 与相关性优先；推荐：行为、兴趣与上下文驱动。</text><text x="40" y="361" fill="#465a73" font-size="16">LLM 可增强请求理解、内容表示或精排；各阶段都需要预算和回退。</text><text x="40" y="400" fill="#465a73" font-size="16">数量为示意；权限、库存等约束可前置，并在展示前复核。</text><text x="38" y="460" fill="#687a90" font-size="13">OfferPilot · 搜索推荐算法</text></g></svg>