<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc">
<title id="title">评估是一条闭环，不是一个分数</title><desc id="desc">按业务时间隔离数据，并同时评估相关性、收益和服务成本</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10" fill="#8093ab"/></marker></defs>
<rect width="960" height="480" rx="14" fill="#ffffff"/>
<path d="M38 100 H922" stroke="#e5ebf3" stroke-width="1"/><rect x="38" y="99" width="52" height="3" rx="1.5" fill="#517cbc"/><g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif"><text x="38" y="48" fill="#172d4b" font-size="26" font-weight="700">评估是一条闭环，不是一个分数</text><text x="38" y="80" fill="#465a73" font-size="16">按业务时间隔离数据，并同时评估相关性、收益和服务成本</text><rect x="40" y="125" width="255" height="80" rx="10" fill="#eff5ff" stroke="#a8c3eb" stroke-width="1"/><text x="167.5" y="155" fill="#172d4b" font-size="19" text-anchor="middle" font-weight="600">训练集</text><text x="167.5" y="182" fill="#465a73" font-size="15" text-anchor="middle">过去数据：学习参数</text><rect x="350" y="125" width="255" height="80" rx="10" fill="#eff5ff" stroke="#a8c3eb" stroke-width="1"/><text x="477.5" y="155" fill="#172d4b" font-size="19" text-anchor="middle" font-weight="600">验证集</text><text x="477.5" y="182" fill="#465a73" font-size="15" text-anchor="middle">后续数据：选择方案</text><rect x="660" y="125" width="255" height="80" rx="10" fill="#eff5ff" stroke="#a8c3eb" stroke-width="1"/><text x="787.5" y="155" fill="#172d4b" font-size="19" text-anchor="middle" font-weight="600">测试集</text><text x="787.5" y="182" fill="#465a73" font-size="15" text-anchor="middle">更晚数据：冻结后评估</text><path d="M298 165 L341 165" stroke="#8093ab" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M608 165 L652 165" stroke="#8093ab" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="170" y="275" width="260" height="80" rx="10" fill="#f4effb" stroke="#c9b6e6" stroke-width="1"/><text x="300.0" y="305" fill="#172d4b" font-size="19" text-anchor="middle" font-weight="600">线上实验</text><text x="300.0" y="332" fill="#465a73" font-size="15" text-anchor="middle">稳定分流 / 业务收益</text><rect x="535" y="275" width="260" height="80" rx="10" fill="#f4effb" stroke="#c9b6e6" stroke-width="1"/><text x="665.0" y="305" fill="#172d4b" font-size="19" text-anchor="middle" font-weight="600">服务与质量护栏</text><text x="665.0" y="332" fill="#465a73" font-size="15" text-anchor="middle">超时 / 错误 / 约束违反</text><path d="M780 208 L780 250" stroke="#8093ab" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M780 250 L300 250" stroke="#8093ab" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M300 250 L300 272" stroke="#8093ab" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M432 315 L530 315" stroke="#8093ab" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="40" y="413" fill="#465a73" font-size="16">先确定口径与时间切分，再看模型增益；不要反复用测试集调参。</text><text x="38" y="460" fill="#687a90" font-size="13">OfferPilot · 搜索推荐算法</text></g></svg>