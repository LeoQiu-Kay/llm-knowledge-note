<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="460" viewBox="0 0 1040 460" role="img"><title>语义编码共享前缀，但最终映射需要消歧</title><rect width="1040" height="460" rx="20" fill="white"/><style>text{font-family:PingFang SC,Microsoft YaHei,sans-serif;fill:#243b59;font-size:20px}.small{font-size:17px;fill:#65758b}</style><text x="40" y="55" style="font-size:27px">语义编码共享前缀，但最终映射需要消歧</text><path d="M40 88H1000" stroke="#e0e7f0"/><text x="60" y="170">物品 A</text><text x="60" y="270">物品 B</text><rect x="220" y="130" width="110" height="60" rx="12" fill="#ede7fa"/><text x="258" y="169">12</text><rect x="375" y="130" width="110" height="60" rx="12" fill="#ede7fa"/><text x="413" y="169">7</text><rect x="530" y="130" width="110" height="60" rx="12" fill="#dcf1e8"/><text x="568" y="169">3</text><rect x="220" y="230" width="110" height="60" rx="12" fill="#ede7fa"/><text x="258" y="269">12</text><rect x="375" y="230" width="110" height="60" rx="12" fill="#ede7fa"/><text x="413" y="269">7</text><rect x="530" y="230" width="110" height="60" rx="12" fill="#dcf1e8"/><text x="568" y="269">9</text><text x="725" y="170">→ 合法物品 A</text><text x="725" y="270">→ 合法物品 B</text><text class="small" x="220" y="365">前两级相同：量化空间中的相近表示</text><text class="small" x="220" y="400">编码不天然等于“品牌 / 颜色 / 尺寸”等显式属性。</text></svg>